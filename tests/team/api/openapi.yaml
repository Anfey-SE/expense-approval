openapi: 3.0.3
info:
  title: Expense Approval MIS API
  version: 1.0.0
  description: >
    OpenAPI 3.0 specification for the Expense Approval MIS (Spring Boot + PostgreSQL).
    Covers Authentication and the two selected Expense Request workflows:
    Workflow 1 (Submit Expense Request) and Workflow 2 (Review Expense Request).
servers:
  - url: http://localhost:8081
    description: Local Docker Compose / Spring Boot server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128

    RegisterRequest:
      type: object
      required: [email, password, fullName]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
        fullName:
          type: string
          minLength: 1
          maxLength: 120
        departmentId:
          type: integer
          format: int64
          minimum: 1
          nullable: true

    ItemInput:
      type: object
      required: [description, category, amount, incurredOn]
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 200
        category:
          type: string
          minLength: 1
          maxLength: 40
        amount:
          type: number
          format: decimal
          minimum: 0.01
          maximum: 9999999999.99
          multipleOf: 0.01
          description: Positive decimal with up to 10 integer digits and 2 fraction digits
        incurredOn:
          type: string
          format: date
          x-constraint: pastOrPresent
          description: Expense date; must be today or in the past

    CreateRequest:
      type: object
      required: [title, items]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 0
          maxLength: 2000
          nullable: true
        currency:
          type: string
          minLength: 3
          maxLength: 3
          nullable: true
          description: 3-letter ISO currency code; defaults to USD if null or blank
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ItemInput'

    DecisionInput:
      type: object
      properties:
        comment:
          type: string
          minLength: 0
          maxLength: 500
          nullable: true

    RequestStatus:
      type: string
      enum:
        - DRAFT
        - SUBMITTED
        - MANAGER_APPROVED
        - FINANCE_APPROVED
        - REJECTED

    UserView:
      type: object
      properties:
        id: { type: integer, format: int64 }
        email: { type: string }
        fullName: { type: string }
        role: { type: string, enum: [EMPLOYEE, MANAGER, FINANCE] }
        departmentId: { type: integer, format: int64, nullable: true }
        departmentName: { type: string, nullable: true }

    AuthResponse:
      type: object
      properties:
        token: { type: string }
        tokenType: { type: string }
        expiresInSeconds: { type: integer, format: int64 }
        user: { $ref: '#/components/schemas/UserView' }

    ItemView:
      type: object
      properties:
        id: { type: integer, format: int64 }
        description: { type: string }
        category: { type: string }
        amount: { type: number }
        incurredOn: { type: string, format: date }

    ApprovalView:
      type: object
      properties:
        id: { type: integer, format: int64 }
        actorId: { type: integer, format: int64 }
        actorName: { type: string }
        action: { type: string, enum: [SUBMIT, APPROVE, REJECT] }
        fromStatus: { $ref: '#/components/schemas/RequestStatus' }
        toStatus: { $ref: '#/components/schemas/RequestStatus' }
        comment: { type: string }
        createdAt: { type: string, format: date-time }

    RequestDetail:
      type: object
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/RequestStatus' }
        totalAmount: { type: number }
        currency: { type: string }
        requesterId: { type: integer, format: int64 }
        requesterName: { type: string }
        departmentName: { type: string }
        submittedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: '#/components/schemas/ItemView' }
        approvals:
          type: array
          items: { $ref: '#/components/schemas/ApprovalView' }

    ErrorResponse:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        timestamp: { type: string, format: date-time }
        fields:
          type: object
          additionalProperties: { type: string }

paths:
  /api/auth/register:
    post:
      summary: Register a new EMPLOYEE account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '400': { description: Validation error or bad department }
        '409': { description: Email already taken }

  /api/auth/login:
    post:
      summary: Authenticate and receive a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: Authenticated, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '400': { description: Validation error }
        '401': { description: Invalid credentials }

  /api/auth/me:
    get:
      summary: Get current authenticated user profile
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Current user }
        '401': { description: Unauthorized }

  /api/requests:
    post:
      summary: Create a new DRAFT expense request with line items
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRequest' }
      responses:
        '201': { description: Draft created, content: { application/json: { schema: { $ref: '#/components/schemas/RequestDetail' } } } }
        '400': { description: Validation error or user has no department }
        '401': { description: Unauthorized }

    get:
      summary: List expense requests scoped by caller role
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/RequestStatus' }
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200': { description: Paginated list }
        '400': { description: Invalid query parameter }
        '401': { description: Unauthorized }

  /api/requests/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      summary: Read back expense request details, line items, and approval trail
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Request detail, content: { application/json: { schema: { $ref: '#/components/schemas/RequestDetail' } } } }
        '401': { description: Unauthorized }
        '404': { description: Not found or not visible to caller }
    put:
      summary: Update a DRAFT expense request (owner only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRequest' }
      responses:
        '200': { description: Draft updated, content: { application/json: { schema: { $ref: '#/components/schemas/RequestDetail' } } } }
        '400': { description: Validation error }
        '401': { description: Unauthorized }
        '403': { description: Not owner }
        '404': { description: Not found }
        '409': { description: Request is not in DRAFT status }

  /api/requests/{id}/submit:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    post:
      summary: Submit a DRAFT expense request (Workflow 1)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Submitted, content: { application/json: { schema: { $ref: '#/components/schemas/RequestDetail' } } } }
        '401': { description: Unauthorized }
        '403': { description: Not owner }
        '404': { description: Not found }
        '409': { description: Not in DRAFT status }

  /api/requests/{id}/approve:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    post:
      summary: Approve a SUBMITTED (Manager) or MANAGER_APPROVED (Finance) request (Workflow 2)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionInput' }
      responses:
        '200': { description: Approved, content: { application/json: { schema: { $ref: '#/components/schemas/RequestDetail' } } } }
        '400': { description: Validation error }
        '401': { description: Unauthorized }
        '403': { description: Wrong role, wrong department, or self-approval }
        '404': { description: Not found }
        '409': { description: Invalid status or concurrent update }

  /api/requests/{id}/reject:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    post:
      summary: Reject a SUBMITTED (Manager) or MANAGER_APPROVED (Finance) request (Workflow 2)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionInput' }
      responses:
        '200': { description: Rejected, content: { application/json: { schema: { $ref: '#/components/schemas/RequestDetail' } } } }
        '400': { description: Validation error }
        '401': { description: Unauthorized }
        '403': { description: Wrong role, wrong department, or self-rejection }
        '404': { description: Not found }
        '409': { description: Invalid status or concurrent update }
